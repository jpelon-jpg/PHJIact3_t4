<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo empleado</title></head>
<body>
    <h1>Nuevo empleado</h1>
    <form th:action="@{/clinica/guardar}" th:object="${empleado}" method="post">
        ID: <input type="number" th:field="*{id}"><br>
        Nombre: <input type="text" th:field="*{nombre}"><br>
        Puesto: <input type="text" th:field="*{puesto}"><br>
        Salario: <input type="number" step="0.01" th:field="*{salario}"><br>
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
